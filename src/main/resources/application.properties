# ================== Database ==================
spring.datasource.url=jdbc:postgresql://localhost:5432/ArmaGest_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update           # Per dev, in produzione usare 'validate'
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hikari pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ================== Server ==================
server.port=8081

# ================== Keycloak / OAuth2 Resource Server ==================
# Issuer URI del realm Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/armagest

# Facoltativo: JWK Set URI (Spring lo calcola automaticamente dall'issuer)
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/armagest/protocol/openid-connect/certs

# ================== Logging ==================
logging.level.org.springframework=INFO
logging.level.com.armaGest=DEBUG
logging.level.com.armaGest.identity_tenant_service.security=DEBUG

# ================== Misc ==================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
